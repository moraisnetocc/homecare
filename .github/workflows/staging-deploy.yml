name: Staging Cloud deploy
on:
  push:
    branches: [develop]
    paths: ['cloud/**', 'compose.yaml', 'deploy/staging/**', '.github/workflows/staging-deploy.yml', '.github/workflows/cloud.yml']
permissions:
  contents: read
concurrency:
  group: homecore-staging
  cancel-in-progress: false
jobs:
  checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - run: pip install -r cloud/requirements.txt
      - run: python -m compileall -q cloud
      - name: Create CI environment file
        run: cp .env.example .env
      - run: docker compose -f compose.yaml config
        env:
          POSTGRES_DB: homecore
          POSTGRES_USER: homecore
          POSTGRES_PASSWORD: ci-only
          POSTGRES_HOST: db
          POSTGRES_PORT: '5432'
      - name: Validate staging compose and shell
        run: |
          cp deploy/staging/.env.example deploy/staging/.env
          docker compose --env-file deploy/staging/.env -f deploy/staging/compose.yaml config --quiet
          bash -n deploy/staging/deploy.sh
      - name: Django regression tests
        run: |
          docker compose up -d --wait db
          docker compose run --rm api python manage.py migrate --noinput
          docker compose run --rm api python manage.py makemigrations --check --dry-run
          docker compose run --rm api pytest -q
      - name: Cleanup
        if: always()
        run: docker compose down -v
  publish:
    needs: checks
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./cloud
          push: true
          tags: ghcr.io/moraisnetocc/homecare-cloud:sha-${{ github.sha }}
          platforms: linux/amd64
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ghcr.io/moraisnetocc/homecare-cloud@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Deploy immutable image over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$keydir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$keydir/known_hosts"
          ssh -i "$keydir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SSH_USER@$SSH_HOST" \
            "sudo -n /usr/local/sbin/homecore-staging-deploy ghcr.io/moraisnetocc/homecare-cloud@$DIGEST"
