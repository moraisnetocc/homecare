name: Staging Cloud deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA on develop to deploy (40 hex characters)"
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Validate commit is on develop
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          [[ "$DEPLOY_REF" =~ ^[a-fA-F0-9]{40}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Ensure commit belongs to develop
        run: |
          git fetch origin develop
          git merge-base --is-ancestor HEAD origin/develop
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cloud
          push: true
          tags: ghcr.io/moraisnetocc/homecare-cloud:sha-${{ inputs.ref }}
          platforms: linux/amd64
      - name: Set image
        id: meta
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        run: echo "image=ghcr.io/moraisnetocc/homecare-cloud:sha-${DEPLOY_REF,,}" >> "$GITHUB_OUTPUT"
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy pinned image
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "sudo -n /usr/local/sbin/homecore-staging-deploy '$IMAGE'"
