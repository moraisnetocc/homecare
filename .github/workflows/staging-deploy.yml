name: Staging Cloud image
on:
  push:
    branches: [develop]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./cloud
          push: true
          tags: ghcr.io/moraisnetocc/homecare-cloud:sha-${{ github.sha }}
          platforms: linux/amd64
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ghcr.io/moraisnetocc/homecare-cloud@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
