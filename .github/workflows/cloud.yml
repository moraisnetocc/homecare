name: Cloud CI
on:
  workflow_call:
  push:
    branches: [main]
    paths: ['cloud/**', 'compose.yaml', 'deploy/staging/**', '.github/workflows/staging-deploy.yml', '.github/workflows/cloud.yml']
  pull_request:
    paths: ['cloud/**', 'compose.yaml', 'deploy/staging/**', '.github/workflows/staging-deploy.yml', '.github/workflows/cloud.yml']
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - run: pip install -r cloud/requirements.txt
      - run: python -m compileall -q cloud
      - name: Create CI environment file
        run: cp .env.example .env
      - run: docker compose -f compose.yaml config
        env:
          POSTGRES_DB: homecore
          POSTGRES_USER: homecore
          POSTGRES_PASSWORD: ci-only
          POSTGRES_HOST: db
          POSTGRES_PORT: '5432'
      - name: Validate staging compose and shell
        run: |
          cp deploy/staging/.env.example deploy/staging/.env
          docker compose --env-file deploy/staging/.env -f deploy/staging/compose.yaml config --quiet
          bash -n deploy/staging/deploy.sh
      - name: Django regression tests
        run: |
          docker compose up -d --wait db
          docker compose run --rm api python manage.py migrate --noinput
          docker compose run --rm api python manage.py makemigrations --check --dry-run
          docker compose run --rm api pytest -q
      - name: Cleanup
        if: always()
        run: docker compose down -v
