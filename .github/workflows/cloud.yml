name: Cloud CI
on:
  push:
    branches: [develop, main]
    paths: ['cloud/**', 'compose.yaml', '.github/workflows/cloud.yml']
  pull_request:
    paths: ['cloud/**', 'compose.yaml', '.github/workflows/cloud.yml']
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - run: pip install -r cloud/requirements.txt
      - run: python -m compileall -q cloud
      - name: Create CI environment file
        run: cp .env.example .env
      - run: docker compose -f compose.yaml config
        env:
          POSTGRES_DB: homecore
          POSTGRES_USER: homecore
          POSTGRES_PASSWORD: ci-only
          POSTGRES_HOST: db
          POSTGRES_PORT: '5432'
