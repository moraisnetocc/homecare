name: Agent CI
on:
  push:
    branches: [develop, main]
    paths: ['agent/**', 'deploy/local/**', '.github/workflows/agent.yml']
  pull_request:
    paths: ['agent/**', 'deploy/local/**', '.github/workflows/agent.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e './agent[test]'
      - run: pytest -q agent/tests
      - run: docker build -t homecore-agent:ci agent
